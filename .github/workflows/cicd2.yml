name: CICD

on:
  workflow_dispatch:

jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        run: echo "Cloning the code"
  build:
    needs: [code]                    # When code steps complete, then only build steps will execute
    runs-on: ubuntu-latest
    steps:
        - name: Clone the code
          run: echo "Cloning the code"
  test:
    needs: [build]                  # When build steps complete, then only test steps will execute
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        run: echo "Cloning the code"
  deploy:
    needs: [build,test]             # When build and test steps both to be completed, then only deploy steps will execute
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        run: echo "Cloning the code"
